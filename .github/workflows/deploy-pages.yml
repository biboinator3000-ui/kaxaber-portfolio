name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: კოდის ჩამოტვირთვა
        uses: actions/checkout@v4
      - name: Node.js-ის გამართვა
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: დამოკიდებულებების დაყენება
        run: npm ci
      - name: საიტის აწყობა
        run: npm run build
      - name: Pages არტეფაქტის ატვირთვა
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages-ზე გამოქვეყნება
        id: deployment
        uses: actions/deploy-pages@v4
